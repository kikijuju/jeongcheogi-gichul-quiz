<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 376" role="img" aria-label="m과 b의 각 칸이 같은 안쪽 리스트 4개를 가리키고 += 로 길이가 1,2,3,4가 되어 출력 10">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
  .m{fill:#666a70;font-size:12.5px}
  .mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
  .b{font-weight:700}
  .acc{fill:#2f6feb}
  .ok{fill:#1f7a4a}
  .ng{fill:#b8403c}
  .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
  .boxa{fill:#e8f0fe;stroke:#2f6feb;stroke-width:1.5}
  .boxok{fill:#e4f6ec;stroke:#23935a;stroke-width:1.5}
  .boxng{fill:#fdecec;stroke:#d64545;stroke-width:1.5}
  .boxd{fill:#f0f1f3;stroke:#c9ced6;stroke-width:1.5}
  .ln{stroke:#1c1e21;stroke-width:1.6;fill:none;marker-end:url(#arw)}
  .lna{stroke:#2f6feb;stroke-width:1.8;fill:none;marker-end:url(#arwA)}
  .lnng{stroke:#d64545;stroke-width:1.6;fill:none;marker-end:url(#arwN)}
  .plain{stroke:#c9ced6;stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4}
  .strike{stroke:#d64545;stroke-width:2}
  .mk{fill:#1c1e21}.mka{fill:#2f6feb}.mkn{fill:#d64545}
  @media (prefers-color-scheme: dark){
    text{fill:#ecedee}
    .m{fill:#9a9ea5}
    .acc{fill:#5b8def}.ok{fill:#8edbad}.ng{fill:#f3a6a3}
    .box{fill:#1f2227;stroke:#45494f}
    .boxa{fill:#1b2a45;stroke:#5b8def}
    .boxok{fill:#1d3428;stroke:#3ecb75}
    .boxng{fill:#3f2427;stroke:#ef6b6b}
    .boxd{fill:#2a2d33;stroke:#45494f}
    .ln{stroke:#ecedee}.lna{stroke:#5b8def}.lnng{stroke:#ef6b6b}
    .plain{stroke:#45494f}.strike{stroke:#ef6b6b}
    .mk{fill:#ecedee}.mka{fill:#5b8def}.mkn{fill:#ef6b6b}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mkn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="m" x="45" y="22">b = m[:] 얕은 복사: 겉 리스트만 새로, 안쪽 4개는 공유</text>
<text class="b mono" x="26" y="63" text-anchor="middle">m</text>
<rect class="box" x="45" y="40" width="520" height="36" rx="6"/>
<text class="m mono" x="76" y="63" text-anchor="middle">[0]</text>
<text class="mono" x="110" y="63" text-anchor="middle">●</text>
<line class="plain" x1="175" y1="40" x2="175" y2="76"/>
<text class="m mono" x="206" y="63" text-anchor="middle">[1]</text>
<text class="mono" x="240" y="63" text-anchor="middle">●</text>
<line class="plain" x1="305" y1="40" x2="305" y2="76"/>
<text class="m mono" x="336" y="63" text-anchor="middle">[2]</text>
<text class="mono" x="370" y="63" text-anchor="middle">●</text>
<line class="plain" x1="435" y1="40" x2="435" y2="76"/>
<text class="m mono" x="466" y="63" text-anchor="middle">[3]</text>
<text class="mono" x="500" y="63" text-anchor="middle">●</text>
<text class="b mono" x="26" y="259" text-anchor="middle">b</text>
<rect class="box" x="45" y="236" width="520" height="36" rx="6"/>
<text class="m mono" x="76" y="259" text-anchor="middle">[0]</text>
<text class="mono" x="110" y="259" text-anchor="middle">●</text>
<line class="plain" x1="175" y1="236" x2="175" y2="272"/>
<text class="m mono" x="206" y="259" text-anchor="middle">[1]</text>
<text class="mono" x="240" y="259" text-anchor="middle">●</text>
<line class="plain" x1="305" y1="236" x2="305" y2="272"/>
<text class="m mono" x="336" y="259" text-anchor="middle">[2]</text>
<text class="mono" x="370" y="259" text-anchor="middle">●</text>
<line class="plain" x1="435" y1="236" x2="435" y2="272"/>
<text class="m mono" x="466" y="259" text-anchor="middle">[3]</text>
<text class="mono" x="500" y="259" text-anchor="middle">●</text>
<line class="ln" x1="110" y1="76" x2="110" y2="128"/>
<line class="ln" x1="110" y1="236" x2="110" y2="184"/>
<rect class="box" x="55" y="130" width="110" height="52" rx="6"/>
<text class="m" x="110" y="150" text-anchor="middle">처음 그대로</text>
<text class="b mono" x="110" y="172" text-anchor="middle">[1]</text>
<line class="ln" x1="240" y1="76" x2="240" y2="128"/>
<line class="ln" x1="240" y1="236" x2="240" y2="184"/>
<rect class="boxa" x="185" y="130" width="110" height="52" rx="6"/>
<text class="m mono" x="240" y="150" text-anchor="middle">i=0: +[1]</text>
<text class="b mono" x="240" y="172" text-anchor="middle">[2, 1]</text>
<line class="ln" x1="370" y1="76" x2="370" y2="128"/>
<line class="ln" x1="370" y1="236" x2="370" y2="184"/>
<rect class="boxa" x="315" y="130" width="110" height="52" rx="6"/>
<text class="m mono" x="370" y="150" text-anchor="middle">i=1: +[2,1]</text>
<text class="b mono" x="370" y="172" text-anchor="middle">[3, 2, 1]</text>
<line class="ln" x1="500" y1="76" x2="500" y2="128"/>
<line class="ln" x1="500" y1="236" x2="500" y2="184"/>
<rect class="boxa" x="445" y="130" width="110" height="52" rx="6"/>
<text class="m mono" x="500" y="150" text-anchor="middle">i=2: +[3,2,1]</text>
<text class="b mono" x="500" y="172" text-anchor="middle">[4, 3, 2, 1]</text>
<text class="m" x="45" y="302">b[i+1] += b[i] 는 제자리 확장 → m에서도 그대로 보임</text>
<text x="310" y="330" text-anchor="middle">len 합 = 1 + 2 + 3 + 4</text>
<text class="b acc" x="310" y="360" text-anchor="middle">출력: 10</text>
</svg>
