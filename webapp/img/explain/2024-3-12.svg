<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="n1, n3, n2 순으로 연결된 리스트에서 n1과 n3 값만 교환되어 312 출력">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
  .m{fill:#666a70;font-size:12.5px}
  .mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
  .b{font-weight:700}
  .acc{fill:#2f6feb}
  .ok{fill:#1f7a4a}
  .ng{fill:#b8403c}
  .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
  .boxa{fill:#e8f0fe;stroke:#2f6feb;stroke-width:1.5}
  .boxok{fill:#e4f6ec;stroke:#23935a;stroke-width:1.5}
  .boxng{fill:#fdecec;stroke:#d64545;stroke-width:1.5}
  .boxd{fill:#f0f1f3;stroke:#c9ced6;stroke-width:1.5}
  .ln{stroke:#1c1e21;stroke-width:1.6;fill:none;marker-end:url(#arw)}
  .lna{stroke:#2f6feb;stroke-width:1.8;fill:none;marker-end:url(#arwA)}
  .lnng{stroke:#d64545;stroke-width:1.6;fill:none;marker-end:url(#arwN)}
  .plain{stroke:#c9ced6;stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4}
  .strike{stroke:#d64545;stroke-width:2}
  .mk{fill:#1c1e21}.mka{fill:#2f6feb}.mkn{fill:#d64545}
  @media (prefers-color-scheme: dark){
    text{fill:#ecedee}
    .m{fill:#9a9ea5}
    .acc{fill:#5b8def}.ok{fill:#8edbad}.ng{fill:#f3a6a3}
    .box{fill:#1f2227;stroke:#45494f}
    .boxa{fill:#1b2a45;stroke:#5b8def}
    .boxok{fill:#1d3428;stroke:#3ecb75}
    .boxng{fill:#3f2427;stroke:#ef6b6b}
    .boxd{fill:#2a2d33;stroke:#45494f}
    .ln{stroke:#ecedee}.lna{stroke:#5b8def}.lnng{stroke:#ef6b6b}
    .plain{stroke:#45494f}.strike{stroke:#ef6b6b}
    .mk{fill:#ecedee}.mka{fill:#5b8def}.mkn{fill:#ef6b6b}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mkn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="b" x="20" y="28" text-anchor="start">① 연결 순서: n1.next=&amp;n3; n3.next=&amp;n2;</text>
<rect class="box" x="80" y="40" width="100" height="46" rx="6"/>
<line class="plain" x1="136" y1="40" x2="136" y2="86"/>
<text class="m" x="108.0" y="58" text-anchor="middle">n1</text>
<text class="b mono" x="108.0" y="78" text-anchor="middle">1</text>
<text class="m" x="158.0" y="58" text-anchor="middle">next</text>
<text class="mono" x="158.0" y="78" text-anchor="middle">●</text>
<line class="ln" x1="180" y1="63" x2="228" y2="63"/>
<rect class="box" x="230" y="40" width="100" height="46" rx="6"/>
<line class="plain" x1="286" y1="40" x2="286" y2="86"/>
<text class="m" x="258.0" y="58" text-anchor="middle">n3</text>
<text class="b mono" x="258.0" y="78" text-anchor="middle">3</text>
<text class="m" x="308.0" y="58" text-anchor="middle">next</text>
<text class="mono" x="308.0" y="78" text-anchor="middle">●</text>
<line class="ln" x1="330" y1="63" x2="378" y2="63"/>
<rect class="box" x="380" y="40" width="100" height="46" rx="6"/>
<line class="plain" x1="436" y1="40" x2="436" y2="86"/>
<text class="m" x="408.0" y="58" text-anchor="middle">n2</text>
<text class="b mono" x="408.0" y="78" text-anchor="middle">2</text>
<text class="m" x="458.0" y="58" text-anchor="middle">next</text>
<text class="m mono" x="458.0" y="78" text-anchor="middle">NULL</text>
<text class="b" x="20" y="134" text-anchor="start">② func(&amp;n1): 두 노드씩 값만 교환</text>
<text class="acc b mono" x="130" y="160" text-anchor="middle">node ①</text>
<text class="m" x="430" y="160" text-anchor="middle">node ②: next=NULL → 종료</text>
<rect class="boxa" x="80" y="170" width="100" height="46" rx="6"/>
<line class="plain" x1="136" y1="170" x2="136" y2="216"/>
<text class="m" x="108.0" y="188" text-anchor="middle">n1</text>
<text class="b mono" x="108.0" y="208" text-anchor="middle">3</text>
<text class="m" x="158.0" y="188" text-anchor="middle">next</text>
<text class="mono" x="158.0" y="208" text-anchor="middle">●</text>
<line class="ln" x1="180" y1="193" x2="228" y2="193"/>
<rect class="boxa" x="230" y="170" width="100" height="46" rx="6"/>
<line class="plain" x1="286" y1="170" x2="286" y2="216"/>
<text class="m" x="258.0" y="188" text-anchor="middle">n3</text>
<text class="b mono" x="258.0" y="208" text-anchor="middle">1</text>
<text class="m" x="308.0" y="188" text-anchor="middle">next</text>
<text class="mono" x="308.0" y="208" text-anchor="middle">●</text>
<line class="ln" x1="330" y1="193" x2="378" y2="193"/>
<rect class="box" x="380" y="170" width="100" height="46" rx="6"/>
<line class="plain" x1="436" y1="170" x2="436" y2="216"/>
<text class="m" x="408.0" y="188" text-anchor="middle">n2</text>
<text class="b mono" x="408.0" y="208" text-anchor="middle">2</text>
<text class="m" x="458.0" y="188" text-anchor="middle">next</text>
<text class="m mono" x="458.0" y="208" text-anchor="middle">NULL</text>
<text class="m" x="205" y="238" text-anchor="middle">t=1 → 값 1 ↔ 3 교환 (연결은 그대로)</text>
<text class="b acc" x="20" y="286" text-anchor="start">출력(연결 순서대로): 312</text>
</svg>
