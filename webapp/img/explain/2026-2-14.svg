<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 322" role="img" aria-label="A RIGHT OUTER JOIN B 결과 4행 중 A.id가 NULL인 B의 id 3, 4 두 행만 남아 출력 2">
