<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 408" role="img" aria-label="super.draw로 A.draw가 B를 출력하고 안의 draw는 B.draw로 가서 D, 이어 C, D, D 출력: BDCDD">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
  .m{fill:#666a70;font-size:12.5px}
  .mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
  .b{font-weight:700}
  .acc{fill:#2f6feb}
  .ok{fill:#1f7a4a}
  .ng{fill:#b8403c}
  .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
  .boxa{fill:#e8f0fe;stroke:#2f6feb;stroke-width:1.5}
  .boxok{fill:#e4f6ec;stroke:#23935a;stroke-width:1.5}
  .boxng{fill:#fdecec;stroke:#d64545;stroke-width:1.5}
  .boxd{fill:#f0f1f3;stroke:#c9ced6;stroke-width:1.5}
  .ln{stroke:#1c1e21;stroke-width:1.6;fill:none;marker-end:url(#arw)}
  .lna{stroke:#2f6feb;stroke-width:1.8;fill:none;marker-end:url(#arwA)}
  .lnng{stroke:#d64545;stroke-width:1.6;fill:none;marker-end:url(#arwN)}
  .plain{stroke:#c9ced6;stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4}
  .strike{stroke:#d64545;stroke-width:2}
  .mk{fill:#1c1e21}.mka{fill:#2f6feb}.mkn{fill:#d64545}
  @media (prefers-color-scheme: dark){
    text{fill:#ecedee}
    .m{fill:#9a9ea5}
    .acc{fill:#5b8def}.ok{fill:#8edbad}.ng{fill:#f3a6a3}
    .box{fill:#1f2227;stroke:#45494f}
    .boxa{fill:#1b2a45;stroke:#5b8def}
    .boxok{fill:#1d3428;stroke:#3ecb75}
    .boxng{fill:#3f2427;stroke:#ef6b6b}
    .boxd{fill:#2a2d33;stroke:#45494f}
    .ln{stroke:#ecedee}.lna{stroke:#5b8def}.lnng{stroke:#ef6b6b}
    .plain{stroke:#45494f}.strike{stroke:#ef6b6b}
    .mk{fill:#ecedee}.mka{fill:#5b8def}.mkn{fill:#ef6b6b}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mkn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="m" x="20" y="20">b의 실제 객체 = B → draw()는 항상 B.draw()</text>
<rect class="box" x="150" y="30" width="320" height="40" rx="6"/>
<text class="m" x="162" y="55">main</text>
<text class="mono" x="245" y="55" text-anchor="middle">b.paint();</text>
<text class="mono" x="395" y="55" text-anchor="middle">b.draw();</text>
<text class="b" x="125" y="100" text-anchor="middle">class A</text>
<text class="b" x="495" y="100" text-anchor="middle">class B</text>
<rect class="boxd" x="20" y="110" width="210" height="46" rx="6"/>
<text class="mono m" x="32" y="130">paint()</text>
<text class="m" x="32" y="148">오버라이딩되어 안 씀</text>
<rect class="boxa" x="20" y="250" width="210" height="80" rx="6"/>
<text class="mono b" x="32" y="270">draw()</text>
<text class="mono" x="44" y="293">print("B");</text>
<text class="b ok" x="160" y="293">B ①</text>
<text class="mono" x="44" y="316">draw();</text>
<rect class="box" x="390" y="110" width="210" height="106" rx="6"/>
<text class="mono b" x="402" y="130">paint()</text>
<text class="mono" x="414" y="153">super.draw();</text>
<text class="mono" x="414" y="176">print("C");</text>
<text class="b ok" x="540" y="176">C ③</text>
<text class="mono" x="414" y="199">this.draw();</text>
<rect class="boxok" x="390" y="270" width="210" height="60" rx="6"/>
<text class="mono b" x="402" y="290">draw()</text>
<text class="mono" x="414" y="313">print("D");</text>
<text class="b ok" x="520" y="313">D ②④⑤</text>
<line class="lna" x1="245" y1="72" x2="438" y2="108"/>
<line class="lna" x1="388" y1="150" x2="234" y2="262"/>
<line class="lna" x1="230" y1="311" x2="386" y2="300"/>
<line class="lna" x1="495" y1="216" x2="495" y2="268"/>
<path class="lna" d="M470,50 H612 V300 H603"/>
<text class="m" x="20" y="354">A.draw() 안의 draw()도 this(B)의 draw() → 재귀 아님</text>
<text class="b acc" x="310" y="392" text-anchor="middle">출력: BDCDD</text>
</svg>
