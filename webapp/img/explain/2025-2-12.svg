<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="크기 3 원형 큐에서 rear가 0으로 순환하고 front가 2, 3을 차례로 꺼내 2 그리고 3 출력">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
  .m{fill:#666a70;font-size:12.5px}
  .mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
  .b{font-weight:700}
  .acc{fill:#2f6feb}
  .ok{fill:#1f7a4a}
  .ng{fill:#b8403c}
  .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
  .boxa{fill:#e8f0fe;stroke:#2f6feb;stroke-width:1.5}
  .boxok{fill:#e4f6ec;stroke:#23935a;stroke-width:1.5}
  .boxng{fill:#fdecec;stroke:#d64545;stroke-width:1.5}
  .boxd{fill:#f0f1f3;stroke:#c9ced6;stroke-width:1.5}
  .ln{stroke:#1c1e21;stroke-width:1.6;fill:none;marker-end:url(#arw)}
  .lna{stroke:#2f6feb;stroke-width:1.8;fill:none;marker-end:url(#arwA)}
  .lnng{stroke:#d64545;stroke-width:1.6;fill:none;marker-end:url(#arwN)}
  .plain{stroke:#c9ced6;stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4}
  .strike{stroke:#d64545;stroke-width:2}
  .mk{fill:#1c1e21}.mka{fill:#2f6feb}.mkn{fill:#d64545}
  @media (prefers-color-scheme: dark){
    text{fill:#ecedee}
    .m{fill:#9a9ea5}
    .acc{fill:#5b8def}.ok{fill:#8edbad}.ng{fill:#f3a6a3}
    .box{fill:#1f2227;stroke:#45494f}
    .boxa{fill:#1b2a45;stroke:#5b8def}
    .boxok{fill:#1d3428;stroke:#3ecb75}
    .boxng{fill:#3f2427;stroke:#ef6b6b}
    .boxd{fill:#2a2d33;stroke:#45494f}
    .ln{stroke:#ecedee}.lna{stroke:#5b8def}.lnng{stroke:#ef6b6b}
    .plain{stroke:#45494f}.strike{stroke:#ef6b6b}
    .mk{fill:#ecedee}.mka{fill:#5b8def}.mkn{fill:#ef6b6b}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mkn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="mono" x="20" y="48" text-anchor="start">enq(1), enq(2)</text>
<text class="m" x="20" y="68" text-anchor="start">deq() → 1 꺼냄</text>
<rect class="boxd" x="300" y="32" width="64" height="44" rx="6"/>
<text class="m mono" x="332" y="47" text-anchor="middle">a[0]</text>
<text class="b mono" x="332" y="68" text-anchor="middle">1</text>
<rect class="box" x="370" y="32" width="64" height="44" rx="6"/>
<text class="m mono" x="402" y="47" text-anchor="middle">a[1]</text>
<text class="b mono" x="402" y="68" text-anchor="middle">2</text>
<rect class="box" x="440" y="32" width="64" height="44" rx="6"/>
<text class="m mono" x="472" y="47" text-anchor="middle">a[2]</text>
<text class="b mono" x="472" y="68" text-anchor="middle">0</text>
<text class="acc b mono" x="402" y="13" text-anchor="middle">front</text>
<line class="lna" x1="402" y1="16" x2="402" y2="30"/>
<line class="ln" x1="472" y1="96" x2="472" y2="79"/>
<text class="b mono" x="472" y="110" text-anchor="middle">rear</text>
<text class="mono" x="20" y="168" text-anchor="start">enq(3): a[2] = 3</text>
<text class="m" x="20" y="188" text-anchor="start">rear = (2+1)%3 = 0</text>
<rect class="boxd" x="300" y="152" width="64" height="44" rx="6"/>
<text class="m mono" x="332" y="167" text-anchor="middle">a[0]</text>
<text class="b mono" x="332" y="188" text-anchor="middle">1</text>
<rect class="box" x="370" y="152" width="64" height="44" rx="6"/>
<text class="m mono" x="402" y="167" text-anchor="middle">a[1]</text>
<text class="b mono" x="402" y="188" text-anchor="middle">2</text>
<rect class="boxa" x="440" y="152" width="64" height="44" rx="6"/>
<text class="m mono" x="472" y="167" text-anchor="middle">a[2]</text>
<text class="b mono" x="472" y="188" text-anchor="middle">3</text>
<text class="acc b mono" x="402" y="133" text-anchor="middle">front</text>
<line class="lna" x1="402" y1="136" x2="402" y2="150"/>
<line class="ln" x1="332" y1="216" x2="332" y2="199"/>
<text class="b mono" x="332" y="230" text-anchor="middle">rear</text>
<text class="m" x="362" y="230" text-anchor="start">← rear가 0으로 순환</text>
<text class="mono" x="20" y="288" text-anchor="start">first = deq() → a[1] = 2</text>
<text class="mono" x="20" y="308" text-anchor="start">second = deq() → a[2] = 3</text>
<rect class="boxd" x="300" y="272" width="64" height="44" rx="6"/>
<text class="m mono" x="332" y="287" text-anchor="middle">a[0]</text>
<text class="b mono" x="332" y="308" text-anchor="middle">1</text>
<rect class="boxok" x="370" y="272" width="64" height="44" rx="6"/>
<text class="m mono" x="402" y="287" text-anchor="middle">a[1]</text>
<text class="b mono" x="402" y="308" text-anchor="middle">2</text>
<rect class="boxok" x="440" y="272" width="64" height="44" rx="6"/>
<text class="m mono" x="472" y="287" text-anchor="middle">a[2]</text>
<text class="b mono" x="472" y="308" text-anchor="middle">3</text>
<text class="acc b mono" x="332" y="253" text-anchor="middle">front</text>
<line class="lna" x1="332" y1="256" x2="332" y2="270"/>
<line class="ln" x1="332" y1="336" x2="332" y2="319"/>
<text class="b mono" x="332" y="350" text-anchor="middle">rear</text>
<text class="b acc" x="20" y="386" text-anchor="start">출력: 2 그리고 3</text>
</svg>
