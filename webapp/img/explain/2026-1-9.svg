<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-label="SELECT DEPT는 200행, DISTINCT DEPT는 3행, WHERE 후 COUNT(DISTINCT DEPT)는 값 1인 1행">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
  .m{fill:#666a70;font-size:12.5px}
  .mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
  .b{font-weight:700}
  .acc{fill:#2f6feb}
  .ok{fill:#1f7a4a}
  .ng{fill:#b8403c}
  .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
  .boxa{fill:#e8f0fe;stroke:#2f6feb;stroke-width:1.5}
  .boxok{fill:#e4f6ec;stroke:#23935a;stroke-width:1.5}
  .boxng{fill:#fdecec;stroke:#d64545;stroke-width:1.5}
  .boxd{fill:#f0f1f3;stroke:#c9ced6;stroke-width:1.5}
  .ln{stroke:#1c1e21;stroke-width:1.6;fill:none;marker-end:url(#arw)}
  .lna{stroke:#2f6feb;stroke-width:1.8;fill:none;marker-end:url(#arwA)}
  .lnng{stroke:#d64545;stroke-width:1.6;fill:none;marker-end:url(#arwN)}
  .plain{stroke:#c9ced6;stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4}
  .strike{stroke:#d64545;stroke-width:2}
  .mk{fill:#1c1e21}.mka{fill:#2f6feb}.mkn{fill:#d64545}
  @media (prefers-color-scheme: dark){
    text{fill:#ecedee}
    .m{fill:#9a9ea5}
    .acc{fill:#5b8def}.ok{fill:#8edbad}.ng{fill:#f3a6a3}
    .box{fill:#1f2227;stroke:#45494f}
    .boxa{fill:#1b2a45;stroke:#5b8def}
    .boxok{fill:#1d3428;stroke:#3ecb75}
    .boxng{fill:#3f2427;stroke:#ef6b6b}
    .boxd{fill:#2a2d33;stroke:#45494f}
    .ln{stroke:#ecedee}.lna{stroke:#5b8def}.lnng{stroke:#ef6b6b}
    .plain{stroke:#45494f}.strike{stroke:#ef6b6b}
    .mk{fill:#ecedee}.mka{fill:#5b8def}.mkn{fill:#ef6b6b}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mkn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="b" x="20" y="24" text-anchor="start">STUDENT (전체 200행)</text>
<rect class="boxd" x="20" y="34" width="145" height="36" rx="0"/>
<text x="92.5" y="57" text-anchor="middle">컴퓨터과 50명</text>
<rect class="boxd" x="165" y="34" width="290" height="36" rx="0"/>
<text x="310.0" y="57" text-anchor="middle">인터넷과 100명</text>
<rect class="boxd" x="455" y="34" width="145" height="36" rx="0"/>
<text x="527.5" y="57" text-anchor="middle">사무자동화과 50명</text>
<text class="b" x="20" y="106" text-anchor="start" font-size="13.5">① SELECT DEPT</text>
<text class="m" x="20" y="124" text-anchor="start">중복 그대로 전부</text>
<text class="b" x="225" y="106" text-anchor="start" font-size="13.5">② SELECT DISTINCT DEPT</text>
<text class="m" x="225" y="124" text-anchor="start">중복 제거 → 학과 종류만</text>
<text class="b" x="430" y="106" text-anchor="start" font-size="13.5">③ COUNT(DISTINCT DEPT)</text>
<text class="m" x="430" y="124" text-anchor="start">WHERE DEPT='컴퓨터과'</text>
<rect class="box" x="20" y="136" width="170" height="30" rx="0"/>
<text x="105.0" y="156" text-anchor="middle">컴퓨터과 × 50</text>
<rect class="box" x="20" y="166" width="170" height="30" rx="0"/>
<text x="105.0" y="186" text-anchor="middle">인터넷과 × 100</text>
<rect class="box" x="20" y="196" width="170" height="30" rx="0"/>
<text x="105.0" y="216" text-anchor="middle">사무자동화과 × 50</text>
<rect class="boxa" x="225" y="136" width="170" height="30" rx="0"/>
<text x="310.0" y="156" text-anchor="middle">컴퓨터과</text>
<rect class="boxa" x="225" y="166" width="170" height="30" rx="0"/>
<text x="310.0" y="186" text-anchor="middle">인터넷과</text>
<rect class="boxa" x="225" y="196" width="170" height="30" rx="0"/>
<text x="310.0" y="216" text-anchor="middle">사무자동화과</text>
<rect class="boxok" x="430" y="136" width="170" height="30" rx="0"/>
<text x="515.0" y="156" text-anchor="middle">컴퓨터과 × 50</text>
<rect class="boxng" x="430" y="166" width="170" height="30" rx="0"/>
<text class="ng" x="515.0" y="186" text-anchor="middle">다른 학과 150</text>
<line class="strike" x1="426" y1="181" x2="604" y2="181"/>
<line class="lna" x1="515.0" y1="198" x2="515.0" y2="214"/>
<rect class="boxa" x="475" y="216" width="80" height="30" rx="0"/>
<text class="b mono" x="515" y="236" text-anchor="middle">1</text>
<text class="b acc" x="105.0" y="268" text-anchor="middle">→ 200행</text>
<text class="b acc" x="310.0" y="268" text-anchor="middle">→ 3행</text>
<text class="b acc" x="515.0" y="268" text-anchor="middle">→ 1행 (집계로 요약)</text>
<text class="b acc" x="20" y="312" text-anchor="start">출력: 1. 200 / 2. 3 / 3. 1</text>
</svg>
