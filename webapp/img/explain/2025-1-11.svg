<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 326" role="img" aria-label="data가 한 칸씩 밀려 저장된 3x3 행렬과 부호를 번갈아 더해 13을 구하는 그림">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
  .m{fill:#666a70;font-size:12.5px}
  .mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
  .b{font-weight:700}
  .acc{fill:#2f6feb}
  .ok{fill:#1f7a4a}
  .ng{fill:#b8403c}
  .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
  .boxa{fill:#e8f0fe;stroke:#2f6feb;stroke-width:1.5}
  .boxok{fill:#e4f6ec;stroke:#23935a;stroke-width:1.5}
  .boxng{fill:#fdecec;stroke:#d64545;stroke-width:1.5}
  .boxd{fill:#f0f1f3;stroke:#c9ced6;stroke-width:1.5}
  .ln{stroke:#1c1e21;stroke-width:1.6;fill:none;marker-end:url(#arw)}
  .lna{stroke:#2f6feb;stroke-width:1.8;fill:none;marker-end:url(#arwA)}
  .lnng{stroke:#d64545;stroke-width:1.6;fill:none;marker-end:url(#arwN)}
  .plain{stroke:#c9ced6;stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4}
  .strike{stroke:#d64545;stroke-width:2}
  .mk{fill:#1c1e21}.mka{fill:#2f6feb}.mkn{fill:#d64545}
  @media (prefers-color-scheme: dark){
    text{fill:#ecedee}
    .m{fill:#9a9ea5}
    .acc{fill:#5b8def}.ok{fill:#8edbad}.ng{fill:#f3a6a3}
    .box{fill:#1f2227;stroke:#45494f}
    .boxa{fill:#1b2a45;stroke:#5b8def}
    .boxok{fill:#1d3428;stroke:#3ecb75}
    .boxng{fill:#3f2427;stroke:#ef6b6b}
    .boxd{fill:#2a2d33;stroke:#45494f}
    .ln{stroke:#ecedee}.lna{stroke:#5b8def}.lnng{stroke:#ef6b6b}
    .plain{stroke:#45494f}.strike{stroke:#ef6b6b}
    .mk{fill:#ecedee}.mka{fill:#5b8def}.mkn{fill:#ef6b6b}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mkn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="b" x="166" y="24" text-anchor="middle">set 후 arr</text>
<text class="b" x="456" y="24" text-anchor="middle">부호: 짝수 i +, 홀수 i −</text>
<text class="m mono" x="99" y="46" text-anchor="middle">[0]</text>
<text class="m mono" x="163" y="46" text-anchor="middle">[1]</text>
<text class="m mono" x="227" y="46" text-anchor="middle">[2]</text>
<text class="m mono" x="54" y="86" text-anchor="middle">[0]</text>
<rect class="boxng" x="70" y="56" width="58" height="50" rx="6"/>
<text class="b mono" x="99" y="80" text-anchor="middle">9</text>
<text class="m mono" x="99" y="98" text-anchor="middle">data[8]</text>
<rect class="boxa" x="134" y="56" width="58" height="50" rx="6"/>
<text class="b mono" x="163" y="80" text-anchor="middle">5</text>
<text class="m mono" x="163" y="98" text-anchor="middle">data[0]</text>
<rect class="box" x="198" y="56" width="58" height="50" rx="6"/>
<text class="b mono" x="227" y="80" text-anchor="middle">2</text>
<text class="m mono" x="227" y="98" text-anchor="middle">data[1]</text>
<text class="m mono" x="54" y="142" text-anchor="middle">[1]</text>
<rect class="box" x="70" y="112" width="58" height="50" rx="6"/>
<text class="b mono" x="99" y="136" text-anchor="middle">7</text>
<text class="m mono" x="99" y="154" text-anchor="middle">data[2]</text>
<rect class="box" x="134" y="112" width="58" height="50" rx="6"/>
<text class="b mono" x="163" y="136" text-anchor="middle">4</text>
<text class="m mono" x="163" y="154" text-anchor="middle">data[3]</text>
<rect class="box" x="198" y="112" width="58" height="50" rx="6"/>
<text class="b mono" x="227" y="136" text-anchor="middle">1</text>
<text class="m mono" x="227" y="154" text-anchor="middle">data[4]</text>
<text class="m mono" x="54" y="198" text-anchor="middle">[2]</text>
<rect class="box" x="70" y="168" width="58" height="50" rx="6"/>
<text class="b mono" x="99" y="192" text-anchor="middle">8</text>
<text class="m mono" x="99" y="210" text-anchor="middle">data[5]</text>
<rect class="box" x="134" y="168" width="58" height="50" rx="6"/>
<text class="b mono" x="163" y="192" text-anchor="middle">3</text>
<text class="m mono" x="163" y="210" text-anchor="middle">data[6]</text>
<rect class="box" x="198" y="168" width="58" height="50" rx="6"/>
<text class="b mono" x="227" y="192" text-anchor="middle">6</text>
<text class="m mono" x="227" y="210" text-anchor="middle">data[7]</text>
<text class="m mono" x="389" y="46" text-anchor="middle">[0]</text>
<text class="m mono" x="453" y="46" text-anchor="middle">[1]</text>
<text class="m mono" x="517" y="46" text-anchor="middle">[2]</text>
<text class="m mono" x="344" y="86" text-anchor="middle">[0]</text>
<rect class="boxok" x="360" y="56" width="58" height="50" rx="6"/>
<text class="b mono ok" x="389" y="87" text-anchor="middle">+9</text>
<rect class="boxng" x="424" y="56" width="58" height="50" rx="6"/>
<text class="b mono ng" x="453" y="87" text-anchor="middle">−5</text>
<rect class="boxok" x="488" y="56" width="58" height="50" rx="6"/>
<text class="b mono ok" x="517" y="87" text-anchor="middle">+2</text>
<text class="m mono" x="344" y="142" text-anchor="middle">[1]</text>
<rect class="boxng" x="360" y="112" width="58" height="50" rx="6"/>
<text class="b mono ng" x="389" y="143" text-anchor="middle">−7</text>
<rect class="boxok" x="424" y="112" width="58" height="50" rx="6"/>
<text class="b mono ok" x="453" y="143" text-anchor="middle">+4</text>
<rect class="boxng" x="488" y="112" width="58" height="50" rx="6"/>
<text class="b mono ng" x="517" y="143" text-anchor="middle">−1</text>
<text class="m mono" x="344" y="198" text-anchor="middle">[2]</text>
<rect class="boxok" x="360" y="168" width="58" height="50" rx="6"/>
<text class="b mono ok" x="389" y="199" text-anchor="middle">+8</text>
<rect class="boxng" x="424" y="168" width="58" height="50" rx="6"/>
<text class="b mono ng" x="453" y="199" text-anchor="middle">−3</text>
<rect class="boxok" x="488" y="168" width="58" height="50" rx="6"/>
<text class="b mono ok" x="517" y="199" text-anchor="middle">+6</text>
<line class="ln" x1="270" y1="140" x2="326" y2="140"/>
<text class="m" x="300" y="250" text-anchor="middle">arr[(i+1)/3%3][(i+1)%3] → 한 칸씩 밀림, 9는 [0][0]으로 순환</text>
<text class="mono" x="300" y="278" text-anchor="middle">9 − 5 + 2 − 7 + 4 − 1 + 8 − 3 + 6 = 13</text>
<text class="b acc" x="300" y="310" text-anchor="middle">출력: 13</text>
</svg>
