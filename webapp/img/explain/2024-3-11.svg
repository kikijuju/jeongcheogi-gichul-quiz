<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 334" role="img" aria-label="a는 Base 타입이라 a.x는 Base의 3, getX는 Derivate 것이 실행되어 21, 출력 52">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
  .m{fill:#666a70;font-size:12.5px}
  .mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
  .b{font-weight:700}
  .acc{fill:#2f6feb}
  .ok{fill:#1f7a4a}
  .ng{fill:#b8403c}
  .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
  .boxa{fill:#e8f0fe;stroke:#2f6feb;stroke-width:1.5}
  .boxok{fill:#e4f6ec;stroke:#23935a;stroke-width:1.5}
  .boxng{fill:#fdecec;stroke:#d64545;stroke-width:1.5}
  .boxd{fill:#f0f1f3;stroke:#c9ced6;stroke-width:1.5}
  .ln{stroke:#1c1e21;stroke-width:1.6;fill:none;marker-end:url(#arw)}
  .lna{stroke:#2f6feb;stroke-width:1.8;fill:none;marker-end:url(#arwA)}
  .lnng{stroke:#d64545;stroke-width:1.6;fill:none;marker-end:url(#arwN)}
  .plain{stroke:#c9ced6;stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4}
  .strike{stroke:#d64545;stroke-width:2}
  .mk{fill:#1c1e21}.mka{fill:#2f6feb}.mkn{fill:#d64545}
  @media (prefers-color-scheme: dark){
    text{fill:#ecedee}
    .m{fill:#9a9ea5}
    .acc{fill:#5b8def}.ok{fill:#8edbad}.ng{fill:#f3a6a3}
    .box{fill:#1f2227;stroke:#45494f}
    .boxa{fill:#1b2a45;stroke:#5b8def}
    .boxok{fill:#1d3428;stroke:#3ecb75}
    .boxng{fill:#3f2427;stroke:#ef6b6b}
    .boxd{fill:#2a2d33;stroke:#45494f}
    .ln{stroke:#ecedee}.lna{stroke:#5b8def}.lnng{stroke:#ef6b6b}
    .plain{stroke:#45494f}.strike{stroke:#ef6b6b}
    .mk{fill:#ecedee}.mka{fill:#5b8def}.mkn{fill:#ef6b6b}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mkn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="m" x="20" y="22">필드 → 선언 타입 기준 · 메서드 → 실제 객체 기준</text>

<rect class="box" x="20" y="78" width="112" height="46" rx="6"/>
<text class="m" x="76" y="72" text-anchor="middle">선언 타입</text>
<text class="b mono" x="76" y="106" text-anchor="middle">Base a</text>
<line class="ln" x1="132" y1="101" x2="168" y2="101"/>
<rect class="boxd" x="170" y="56" width="240" height="45" rx="6"/>
<rect class="boxa" x="170" y="101" width="240" height="45" rx="6"/>
<text class="m" x="182" y="73">Base 부분</text>
<text class="mono" x="182" y="93">x = 3</text>
<text class="mono m" x="270" y="93">getX(): x*2</text>
<line class="strike" x1="266" y1="89" x2="356" y2="89"/>
<text class="m" x="182" y="118">Derivate 부분</text>
<text class="mono" x="182" y="138">x = 7</text>
<text class="mono b" x="270" y="138">getX(): x*3</text>
<line class="lna" x1="436" y1="78" x2="414" y2="78"/>
<text class="mono b" x="442" y="83">a.x → 3</text>
<line class="lna" x1="436" y1="124" x2="414" y2="124"/>
<text class="mono b" x="442" y="129">a.getX() → 7*3=21</text>

<rect class="box" x="20" y="218" width="112" height="46" rx="6"/>
<text class="m" x="76" y="212" text-anchor="middle">선언 타입</text>
<text class="b mono" x="76" y="246" text-anchor="middle">Derivate b</text>
<line class="ln" x1="132" y1="241" x2="168" y2="241"/>
<rect class="boxd" x="170" y="196" width="240" height="45" rx="6"/>
<rect class="boxa" x="170" y="241" width="240" height="45" rx="6"/>
<text class="m" x="182" y="213">Base 부분</text>
<text class="mono" x="182" y="233">x = 3</text>
<text class="mono m" x="270" y="233">getX(): x*2</text>
<line class="strike" x1="266" y1="229" x2="356" y2="229"/>
<text class="m" x="182" y="258">Derivate 부분</text>
<text class="mono" x="182" y="278">x = 7</text>
<text class="mono b" x="270" y="278">getX(): x*3</text>
<line class="lna" x1="436" y1="254" x2="414" y2="254"/>
<text class="mono b" x="442" y="259">b.x → 7</text>
<line class="lna" x1="436" y1="276" x2="414" y2="276"/>
<text class="mono b" x="442" y="281">b.getX() → 7*3=21</text>

<text class="b acc" x="310" y="318" text-anchor="middle">출력: 21 + 3 + 21 + 7 = 52</text>
</svg>
