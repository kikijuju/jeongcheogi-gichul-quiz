<text class="m mono" x="458.0" y="188" text-anchor="middle">NULL</text>
<text class="m mono" x="130" y="218" text-anchor="middle">head-&gt;p</text>
<text class="m mono" x="280" y="218" text-anchor="middle">head-&gt;n-&gt;p</text>
<text class="m mono" x="430" y="218" text-anchor="middle">head-&gt;n-&gt;n-&gt;p</text>
<text class="b acc" x="130" y="238" text-anchor="middle">= 3</text>
<text class="b acc" x="280" y="238" text-anchor="middle">= 1</text>
<text class="b acc" x="430" y="238" text-anchor="middle">= 2</text>
<text class="b acc" x="20" y="276" text-anchor="start">출력: 3 1 2</text>
