<text class="b" x="20" y="138" text-anchor="start">② 재대입 후: c.n=&amp;a; a.n=&amp;b; b.n=NULL;</text>
<text class="b mono" x="40" y="178" text-anchor="middle">head</text>
<line class="ln" x1="62" y1="173" x2="78" y2="173"/>
