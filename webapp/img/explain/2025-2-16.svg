<text class="m" x="158.0" y="168" text-anchor="middle">next</text>
<text class="mono" x="158.0" y="188" text-anchor="middle">●</text>
<line class="lna" x1="180" y1="173" x2="228" y2="173"/>
<rect class="boxa" x="230" y="150" width="100" height="46" rx="6"/>
<line class="plain" x1="286" y1="150" x2="286" y2="196"/>
<text class="m" x="258.0" y="168" text-anchor="middle">a</text>
<text class="b mono" x="258.0" y="188" text-anchor="middle">1</text>
<text class="m" x="308.0" y="168" text-anchor="middle">next</text>
