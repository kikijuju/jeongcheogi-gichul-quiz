<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="이중 포인터 pp가 p를 거쳐 arr를 가리키고, 각 원소를 (값+i)%5로 바꾼 뒤 arr[2]=1 출력">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
  .m{fill:#666a70;font-size:12.5px}
  .mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
  .b{font-weight:700}
  .acc{fill:#2f6feb}
  .ok{fill:#1f7a4a}
  .ng{fill:#b8403c}
  .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
  .boxa{fill:#e8f0fe;stroke:#2f6feb;stroke-width:1.5}
  .boxok{fill:#e4f6ec;stroke:#23935a;stroke-width:1.5}
  .boxng{fill:#fdecec;stroke:#d64545;stroke-width:1.5}
  .boxd{fill:#f0f1f3;stroke:#c9ced6;stroke-width:1.5}
  .ln{stroke:#1c1e21;stroke-width:1.6;fill:none;marker-end:url(#arw)}
  .lna{stroke:#2f6feb;stroke-width:1.8;fill:none;marker-end:url(#arwA)}
  .lnng{stroke:#d64545;stroke-width:1.6;fill:none;marker-end:url(#arwN)}
  .plain{stroke:#c9ced6;stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4}
  .strike{stroke:#d64545;stroke-width:2}
  .mk{fill:#1c1e21}.mka{fill:#2f6feb}.mkn{fill:#d64545}
  @media (prefers-color-scheme: dark){
    text{fill:#ecedee}
    .m{fill:#9a9ea5}
    .acc{fill:#5b8def}.ok{fill:#8edbad}.ng{fill:#f3a6a3}
    .box{fill:#1f2227;stroke:#45494f}
    .boxa{fill:#1b2a45;stroke:#5b8def}
    .boxok{fill:#1d3428;stroke:#3ecb75}
    .boxng{fill:#3f2427;stroke:#ef6b6b}
    .boxd{fill:#2a2d33;stroke:#45494f}
    .ln{stroke:#ecedee}.lna{stroke:#5b8def}.lnng{stroke:#ef6b6b}
    .plain{stroke:#45494f}.strike{stroke:#ef6b6b}
    .mk{fill:#ecedee}.mka{fill:#5b8def}.mkn{fill:#ef6b6b}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mkn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="b mono" x="44" y="52" text-anchor="middle">pp</text>
<rect class="box" x="16" y="60" width="56" height="40" rx="6"/>
<text class="mono" x="44" y="85" text-anchor="middle">&amp;p</text>
<line class="ln" x1="72" y1="80" x2="104" y2="80"/>
<text class="b mono" x="134" y="52" text-anchor="middle">p</text>
<rect class="box" x="106" y="60" width="56" height="40" rx="6"/>
<text class="mono" x="134" y="85" text-anchor="middle">arr</text>
<line class="ln" x1="162" y1="80" x2="198" y2="80"/>
<text class="m mono" x="232" y="52" text-anchor="middle">arr[0]</text>
<rect class="box" x="200" y="60" width="64" height="40" rx="6"/>
<text class="mono" x="232" y="86" text-anchor="middle">3</text>
<text class="m mono" x="232" y="123" text-anchor="middle">(3+0)%5</text>
<rect class="box" x="200" y="134" width="64" height="40" rx="6"/>
<text class="mono" x="232" y="160" text-anchor="middle">3</text>
<text class="m mono" x="304" y="52" text-anchor="middle">arr[1]</text>
<rect class="box" x="272" y="60" width="64" height="40" rx="6"/>
<text class="mono" x="304" y="86" text-anchor="middle">1</text>
<text class="m mono" x="304" y="123" text-anchor="middle">(1+1)%5</text>
<rect class="box" x="272" y="134" width="64" height="40" rx="6"/>
<text class="mono" x="304" y="160" text-anchor="middle">2</text>
<text class="m mono" x="376" y="52" text-anchor="middle">arr[2]</text>
<rect class="box" x="344" y="60" width="64" height="40" rx="6"/>
<text class="mono" x="376" y="86" text-anchor="middle">4</text>
<text class="m mono" x="376" y="123" text-anchor="middle">(4+2)%5</text>
<rect class="boxa" x="344" y="134" width="64" height="40" rx="6"/>
<text class="b mono" x="376" y="160" text-anchor="middle">1</text>
<text class="m mono" x="448" y="52" text-anchor="middle">arr[3]</text>
<rect class="box" x="416" y="60" width="64" height="40" rx="6"/>
<text class="mono" x="448" y="86" text-anchor="middle">1</text>
<text class="m mono" x="448" y="123" text-anchor="middle">(1+3)%5</text>
<rect class="box" x="416" y="134" width="64" height="40" rx="6"/>
<text class="mono" x="448" y="160" text-anchor="middle">4</text>
<text class="m mono" x="520" y="52" text-anchor="middle">arr[4]</text>
<rect class="box" x="488" y="60" width="64" height="40" rx="6"/>
<text class="mono" x="520" y="86" text-anchor="middle">5</text>
<text class="m mono" x="520" y="123" text-anchor="middle">(5+4)%5</text>
<rect class="box" x="488" y="134" width="64" height="40" rx="6"/>
<text class="mono" x="520" y="160" text-anchor="middle">4</text>
<text class="m" x="572" y="85" text-anchor="start">호출 전</text>
<text class="m" x="572" y="159" text-anchor="start">호출 후</text>
<text class="acc mono" x="376" y="196" text-anchor="middle">num = arr[2]</text>
<text class="m" x="134" y="152" text-anchor="middle">func 안</text>
<text class="m mono" x="134" y="172" text-anchor="middle">*(*arr+i)</text>
<text class="m mono" x="134" y="190" text-anchor="middle">= arr[i]</text>
<text class="m" x="320" y="230" text-anchor="middle">size = 5 · num의 초깃값 6은 덮어써짐</text>
<text class="b acc" x="320" y="262" text-anchor="middle">출력: 1</text>
</svg>
