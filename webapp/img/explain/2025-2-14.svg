<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 272" role="img" aria-label="pptr가 ptr를 거쳐 a를 가리키고, a[2]의 값 {5, 6}이 a[1]에 통째로 복사됨">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
  .m{fill:#666a70;font-size:12.5px}
  .mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
  .b{font-weight:700}
  .acc{fill:#2f6feb}
  .ok{fill:#1f7a4a}
  .ng{fill:#b8403c}
  .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
  .boxa{fill:#e8f0fe;stroke:#2f6feb;stroke-width:1.5}
  .boxok{fill:#e4f6ec;stroke:#23935a;stroke-width:1.5}
  .boxng{fill:#fdecec;stroke:#d64545;stroke-width:1.5}
  .boxd{fill:#f0f1f3;stroke:#c9ced6;stroke-width:1.5}
  .ln{stroke:#1c1e21;stroke-width:1.6;fill:none;marker-end:url(#arw)}
  .lna{stroke:#2f6feb;stroke-width:1.8;fill:none;marker-end:url(#arwA)}
  .lnng{stroke:#d64545;stroke-width:1.6;fill:none;marker-end:url(#arwN)}
  .plain{stroke:#c9ced6;stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4}
  .strike{stroke:#d64545;stroke-width:2}
  .mk{fill:#1c1e21}.mka{fill:#2f6feb}.mkn{fill:#d64545}
  @media (prefers-color-scheme: dark){
    text{fill:#ecedee}
    .m{fill:#9a9ea5}
    .acc{fill:#5b8def}.ok{fill:#8edbad}.ng{fill:#f3a6a3}
    .box{fill:#1f2227;stroke:#45494f}
    .boxa{fill:#1b2a45;stroke:#5b8def}
    .boxok{fill:#1d3428;stroke:#3ecb75}
    .boxng{fill:#3f2427;stroke:#ef6b6b}
    .boxd{fill:#2a2d33;stroke:#45494f}
    .ln{stroke:#ecedee}.lna{stroke:#5b8def}.lnng{stroke:#ef6b6b}
    .plain{stroke:#45494f}.strike{stroke:#ef6b6b}
    .mk{fill:#ecedee}.mka{fill:#5b8def}.mkn{fill:#ef6b6b}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mkn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text class="b mono" x="46" y="62" text-anchor="middle">pptr</text>
<rect class="box" x="16" y="70" width="60" height="40" rx="6"/>
<text class="mono" x="46" y="95" text-anchor="middle">&amp;ptr</text>
<line class="ln" x1="76" y1="90" x2="108" y2="90"/>
<text class="b mono" x="140" y="62" text-anchor="middle">ptr</text>
<rect class="box" x="110" y="70" width="60" height="40" rx="6"/>
<text class="mono" x="140" y="95" text-anchor="middle">a</text>
<text class="m mono" x="140" y="130" text-anchor="middle">= *pptr</text>
<line class="ln" x1="170" y1="90" x2="206" y2="90"/>
<text class="b mono" x="262" y="32" text-anchor="middle">a[0]</text>
<text class="m mono" x="262" y="52" text-anchor="middle">(*pptr)[0]</text>
<rect class="box" x="210" y="62" width="104" height="64" rx="6"/>
<text class="b mono" x="382" y="32" text-anchor="middle">a[1]</text>
<text class="m mono" x="382" y="52" text-anchor="middle">(*pptr)[1]</text>
<rect class="boxok" x="330" y="62" width="104" height="64" rx="6"/>
<text class="b mono" x="502" y="32" text-anchor="middle">a[2]</text>
<text class="m mono" x="502" y="52" text-anchor="middle">(*pptr)[2]</text>
<rect class="boxa" x="450" y="62" width="104" height="64" rx="6"/>
<text class="mono" x="262" y="100" text-anchor="middle">{1, 2}</text>
<text class="m mono" x="382" y="90" text-anchor="middle">{3, 4}</text>
<line class="strike" x1="358" y1="85" x2="406" y2="85"/>
<text class="b mono ok" x="382" y="114" text-anchor="middle">{5, 6}</text>
<text class="b mono" x="502" y="100" text-anchor="middle">{5, 6}</text>
<path class="lna" d="M502,126 C502,172 382,172 382,130"/>
<text class="mono acc" x="442" y="196" text-anchor="middle">(*pptr)[1] = (*pptr)[2]</text>
<text class="m" x="442" y="218" text-anchor="middle">즉 a[1] = a[2] · x, y 모두 복사</text>
<text class="b acc" x="290" y="256" text-anchor="middle">출력: 5 그리고 6</text>
</svg>
