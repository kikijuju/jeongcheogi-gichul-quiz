<text class="m" x="30" y="228" text-anchor="start">OR는 한쪽만 참이면 참 → 5행 모두 통과</text>
<text class="b" x="20" y="270" text-anchor="start">② SELECT COUNT(col2) — 남은 5행의 col2</text>
