<text class="b" x="320" y="24" text-anchor="start">① 서브쿼리 먼저</text>
<rect class="boxa" x="320" y="50" width="260" height="68" rx="6"/>
<text class="mono" x="450" y="76" text-anchor="middle" font-size="12.5">SELECT AVG(budget) FROM dept</text>
<text class="b mono acc" x="450" y="104" text-anchor="middle">(100+300+200) / 3 = 200</text>
<text class="b" x="20" y="172" text-anchor="start">② employee JOIN dept ON dep_id = dept_id</text>
<text class="b" x="20" y="194" text-anchor="start">③ WHERE budget &gt; 200</text>
