<path class="lna" d="M450,118 L450,200 L315,200 L315,212"/>
<text class="m" x="400" y="278" text-anchor="start">30번(200)은 직원이 없어</text>
<text class="m" x="400" y="296" text-anchor="start">JOIN 결과에 없음</text>
<text class="m" x="400" y="314" text-anchor="start">(200 &gt; 200도 거짓)</text>
<text class="b" x="20" y="360" text-anchor="start">④ COUNT(*) = 직원 행 2개 (부서 수 1이 아님)</text>
<text class="b acc" x="20" y="392" text-anchor="start">출력: 2</text>
