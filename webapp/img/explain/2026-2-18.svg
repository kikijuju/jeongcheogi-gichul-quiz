<text class="mono b ng" x="160" y="282" text-anchor="middle">c(-1)=-1</text>
<text class="mono" x="340" y="226" text-anchor="start">c(n) = c(n-1) + c(n-3)</text>
<text class="mono" x="340" y="250" text-anchor="start">c(2) = 1 + (-1) = 0</text>
<text class="mono" x="340" y="274" text-anchor="start">c(5) = c(4) + c(2) = 1 + 0</text>
<text class="ng" x="340" y="302" text-anchor="start">n ≤ 1이면 n 그대로: c(-1) = -1</text>
<text class="b acc" x="310" y="340" text-anchor="middle">출력: 1</text>
</svg>
