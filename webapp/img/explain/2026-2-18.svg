<text class="mono b" x="350" y="42" text-anchor="middle">c(5)=1</text>
<rect class="box" x="188" y="80" width="84" height="34" rx="6"/>
<text class="mono" x="230" y="102" text-anchor="middle">c(4)=1</text>
<rect class="box" x="433" y="80" width="84" height="34" rx="6"/>
<text class="mono" x="475" y="102" text-anchor="middle">c(2)=0</text>
<rect class="box" x="123" y="140" width="84" height="34" rx="6"/>
