<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 342" role="img" aria-label="후위 순회 방문 순서 35, 53, 12, 64, 21에서 세 번째 방문 노드 12가 출력">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
  .m{fill:#666a70;font-size:12.5px}
  .mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
  .b{font-weight:700}
  .acc{fill:#2f6feb}
  .ok{fill:#1f7a4a}
  .ng{fill:#b8403c}
  .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
  .boxa{fill:#e8f0fe;stroke:#2f6feb;stroke-width:1.5}
  .boxok{fill:#e4f6ec;stroke:#23935a;stroke-width:1.5}
  .boxng{fill:#fdecec;stroke:#d64545;stroke-width:1.5}
  .boxd{fill:#f0f1f3;stroke:#c9ced6;stroke-width:1.5}
  .ln{stroke:#1c1e21;stroke-width:1.6;fill:none;marker-end:url(#arw)}
  .lna{stroke:#2f6feb;stroke-width:1.8;fill:none;marker-end:url(#arwA)}
  .lnng{stroke:#d64545;stroke-width:1.6;fill:none;marker-end:url(#arwN)}
  .plain{stroke:#c9ced6;stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4}
  .strike{stroke:#d64545;stroke-width:2}
  .mk{fill:#1c1e21}.mka{fill:#2f6feb}.mkn{fill:#d64545}
  @media (prefers-color-scheme: dark){
    text{fill:#ecedee}
    .m{fill:#9a9ea5}
    .acc{fill:#5b8def}.ok{fill:#8edbad}.ng{fill:#f3a6a3}
    .box{fill:#1f2227;stroke:#45494f}
    .boxa{fill:#1b2a45;stroke:#5b8def}
    .boxok{fill:#1d3428;stroke:#3ecb75}
    .boxng{fill:#3f2427;stroke:#ef6b6b}
    .boxd{fill:#2a2d33;stroke:#45494f}
    .ln{stroke:#ecedee}.lna{stroke:#5b8def}.lnng{stroke:#ef6b6b}
    .plain{stroke:#45494f}.strike{stroke:#ef6b6b}
    .mk{fill:#ecedee}.mka{fill:#5b8def}.mkn{fill:#ef6b6b}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mkn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<line class="plain" x1="300" y1="70" x2="160" y2="120"/>
<line class="plain" x1="300" y1="70" x2="440" y2="120"/>
<line class="plain" x1="160" y1="160" x2="80" y2="210"/>
<line class="plain" x1="160" y1="160" x2="240" y2="210"/>
<rect class="box" x="255.0" y="30" width="90" height="40" rx="6"/>
<text class="m" x="300" y="56" text-anchor="middle">na <tspan class="b mono">21</tspan></text>
<circle class="boxa" cx="359.0" cy="36" r="11"/>
<text class="b acc" x="359.0" y="41" text-anchor="middle">5</text>
<rect class="boxok" x="115.0" y="120" width="90" height="40" rx="6"/>
<text class="m" x="160" y="146" text-anchor="middle">nb <tspan class="b mono">12</tspan></text>
<circle class="boxok" cx="219.0" cy="126" r="11"/>
<text class="b ok" x="219.0" y="131" text-anchor="middle">3</text>
<rect class="box" x="395.0" y="120" width="90" height="40" rx="6"/>
<text class="m" x="440" y="146" text-anchor="middle">nd <tspan class="b mono">64</tspan></text>
<circle class="boxa" cx="499.0" cy="126" r="11"/>
<text class="b acc" x="499.0" y="131" text-anchor="middle">4</text>
<rect class="box" x="35.0" y="210" width="90" height="40" rx="6"/>
<text class="m" x="80" y="236" text-anchor="middle">ne <tspan class="b mono">35</tspan></text>
<circle class="boxa" cx="139.0" cy="216" r="11"/>
<text class="b acc" x="139.0" y="221" text-anchor="middle">1</text>
<rect class="box" x="195.0" y="210" width="90" height="40" rx="6"/>
<text class="m" x="240" y="236" text-anchor="middle">nc <tspan class="b mono">53</tspan></text>
<circle class="boxa" cx="299.0" cy="216" r="11"/>
<text class="b acc" x="299.0" y="221" text-anchor="middle">2</text>
<text class="ok b" x="160" y="274" text-anchor="middle">++c == 3 → ans = 12</text>
<text class="m" x="580" y="40" text-anchor="end">후위: 왼 → 오 → 자신</text>
<text class="m" x="580" y="60" text-anchor="end">번호 = 방문(c) 순서</text>
<text class="m" x="20" y="302" text-anchor="start">방문: 35 → 53 → 12 → 64 → 21</text>
<text class="b acc" x="20" y="328" text-anchor="start">출력: 12</text>
</svg>
