<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 364" role="img" aria-label="문자열 KOREA를 가리키는 포인터 p로 p+1, *(p+3), *p+4를 구분하는 메모리 그림">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
  .m{fill:#666a70;font-size:12.5px}
  .mono{font-family:Consolas,"SFMono-Regular",Menlo,monospace}
  .b{font-weight:700}
  .acc{fill:#2f6feb}
  .ok{fill:#1f7a4a}
  .ng{fill:#b8403c}
  .box{fill:#ffffff;stroke:#c9ced6;stroke-width:1.5}
  .boxa{fill:#e8f0fe;stroke:#2f6feb;stroke-width:1.5}
  .boxok{fill:#e4f6ec;stroke:#23935a;stroke-width:1.5}
  .boxng{fill:#fdecec;stroke:#d64545;stroke-width:1.5}
  .boxd{fill:#f0f1f3;stroke:#c9ced6;stroke-width:1.5}
  .ln{stroke:#1c1e21;stroke-width:1.6;fill:none;marker-end:url(#arw)}
  .lna{stroke:#2f6feb;stroke-width:1.8;fill:none;marker-end:url(#arwA)}
  .lnng{stroke:#d64545;stroke-width:1.6;fill:none;marker-end:url(#arwN)}
  .plain{stroke:#c9ced6;stroke-width:1.5;fill:none}
  .dash{stroke-dasharray:5 4}
  .strike{stroke:#d64545;stroke-width:2}
  .mk{fill:#1c1e21}.mka{fill:#2f6feb}.mkn{fill:#d64545}
  @media (prefers-color-scheme: dark){
    text{fill:#ecedee}
    .m{fill:#9a9ea5}
    .acc{fill:#5b8def}.ok{fill:#8edbad}.ng{fill:#f3a6a3}
    .box{fill:#1f2227;stroke:#45494f}
    .boxa{fill:#1b2a45;stroke:#5b8def}
    .boxok{fill:#1d3428;stroke:#3ecb75}
    .boxng{fill:#3f2427;stroke:#ef6b6b}
    .boxd{fill:#2a2d33;stroke:#45494f}
    .ln{stroke:#ecedee}.lna{stroke:#5b8def}.lnng{stroke:#ef6b6b}
    .plain{stroke:#45494f}.strike{stroke:#ef6b6b}
    .mk{fill:#ecedee}.mka{fill:#5b8def}.mkn{fill:#ef6b6b}
  }
</style>
<defs>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mka" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mkn" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="boxa" x="150" y="90" width="50" height="46" rx="6"/>
<text class="b mono" x="175" y="119" text-anchor="middle">K</text>
<text class="m mono" x="175" y="156" text-anchor="middle">[0]</text>
<rect class="box" x="206" y="90" width="50" height="46" rx="6"/>
<text class="mono" x="231" y="119" text-anchor="middle">O</text>
<text class="m mono" x="231" y="156" text-anchor="middle">[1]</text>
<rect class="box" x="262" y="90" width="50" height="46" rx="6"/>
<text class="mono" x="287" y="119" text-anchor="middle">R</text>
<text class="m mono" x="287" y="156" text-anchor="middle">[2]</text>
<rect class="boxa" x="318" y="90" width="50" height="46" rx="6"/>
<text class="b mono" x="343" y="119" text-anchor="middle">E</text>
<text class="m mono" x="343" y="156" text-anchor="middle">[3]</text>
<rect class="box" x="374" y="90" width="50" height="46" rx="6"/>
<text class="mono" x="399" y="119" text-anchor="middle">A</text>
<text class="m mono" x="399" y="156" text-anchor="middle">[4]</text>
<rect class="boxd" x="430" y="90" width="50" height="46" rx="6"/>
<text class="m mono" x="455" y="119" text-anchor="middle">\0</text>
<text class="m mono" x="455" y="156" text-anchor="middle">[5]</text>
<text class="b mono acc" x="175" y="52" text-anchor="middle">p</text>
<line class="lna" x1="175" y1="60" x2="175" y2="86"/>
<text class="b mono acc" x="231" y="52" text-anchor="middle">p+1</text>
<line class="lna" x1="231" y1="60" x2="231" y2="86"/>
<text class="b mono acc" x="343" y="52" text-anchor="middle">p+3</text>
<line class="lna" x1="343" y1="60" x2="343" y2="86"/>
<text class="m mono" x="70" y="196" text-anchor="start">%s</text>
<text class="mono" x="110" y="196" text-anchor="start">p</text>
<text class="b mono" x="200" y="196" text-anchor="start">→ KOREA</text>
<text class="m" x="310" y="196" text-anchor="start">처음부터 \0 전까지</text>
<text class="m mono" x="70" y="220" text-anchor="start">%s</text>
<text class="mono" x="110" y="220" text-anchor="start">p+1</text>
<text class="b mono" x="200" y="220" text-anchor="start">→ OREA</text>
<text class="m" x="310" y="220" text-anchor="start">인덱스 1부터</text>
<text class="m mono" x="70" y="244" text-anchor="start">%c</text>
<text class="mono" x="110" y="244" text-anchor="start">*p</text>
<text class="b mono" x="200" y="244" text-anchor="start">→ K</text>
<text class="m" x="310" y="244" text-anchor="start">첫 글자</text>
<text class="m mono" x="70" y="268" text-anchor="start">%c</text>
<text class="mono" x="110" y="268" text-anchor="start">*(p+3)</text>
<text class="b mono" x="200" y="268" text-anchor="start">→ E</text>
<text class="m" x="310" y="268" text-anchor="start">인덱스 3</text>
<text class="m mono" x="70" y="292" text-anchor="start">%c</text>
<text class="mono" x="110" y="292" text-anchor="start">*p+4</text>
<text class="b mono" x="200" y="292" text-anchor="start">→ O</text>
<text class="mono acc" x="310" y="292" text-anchor="start">(*p)+4: K→L→M→N→O</text>
<text class="ng" x="310" y="316" text-anchor="start">*(p+4)='A'가 아니에요 (* 먼저)</text>
<text class="b acc" x="300" y="346" text-anchor="middle">출력: KOREA / OREA / K / E / O</text>
</svg>
