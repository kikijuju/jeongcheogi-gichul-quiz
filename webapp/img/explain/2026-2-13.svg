<text class="m b" x="275.0" y="241.0" text-anchor="middle">B.y</text>
<rect class="boxd" x="340" y="222" width="90" height="28" rx="0"/>
<text class="m b" x="385.0" y="241.0" text-anchor="middle">AVG(y)</text>
<rect class="boxd" x="430" y="222" width="80" height="28" rx="0"/>
<text class="m b" x="470.0" y="241.0" text-anchor="middle">x &gt; AVG</text>
<rect class="boxng" x="20" y="250" width="60" height="28" rx="0"/>
<text class="mono" x="50.0" y="269.0" text-anchor="middle">10</text>
