<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-label="상관 서브쿼리: A.x가 10이면 AVG가 NULL이라 제외, 20·30·40은 평균보다 커서 통과, 출력 3">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
