<text class="mono" x="145.0" y="353.0" text-anchor="middle">{1, 2, 3}</text>
<rect class="boxok" x="210" y="334" width="130" height="28" rx="0"/>
<text class="mono" x="275.0" y="353.0" text-anchor="middle">5, 15, 20, 35</text>
<rect class="boxok" x="340" y="334" width="90" height="28" rx="0"/>
<text class="mono" x="385.0" y="353.0" text-anchor="middle">18.75</text>
