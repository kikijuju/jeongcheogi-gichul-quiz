<line class="strike" x1="16" y1="264.0" x2="514" y2="264.0"/>
<text class="m" x="20" y="384" text-anchor="start">10 &gt; NULL → 알 수 없음(UNKNOWN) → 제외  (빈 집합 AVG는 0이 아님)</text>
<text class="b" x="20" y="414" text-anchor="start">⑤ COUNT(*) = 남은 행 3개</text>
<text class="b acc" x="20" y="444" text-anchor="start">출력: 3</text>
