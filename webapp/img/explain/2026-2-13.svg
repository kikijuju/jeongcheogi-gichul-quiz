<text class="mono" x="275.0" y="297.0" text-anchor="middle">5, 15</text>
<rect class="boxok" x="340" y="278" width="90" height="28" rx="0"/>
<text class="mono" x="385.0" y="297.0" text-anchor="middle">10</text>
