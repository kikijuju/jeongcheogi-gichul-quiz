<rect class="boxok" x="340" y="306" width="90" height="28" rx="0"/>
<text class="mono" x="385.0" y="325.0" text-anchor="middle">13.33</text>
<rect class="boxok" x="430" y="306" width="80" height="28" rx="0"/>
<text class="ok b" x="470.0" y="325.0" text-anchor="middle">O</text>
