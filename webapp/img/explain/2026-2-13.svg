<text class="b" x="260" y="48" text-anchor="start">바깥 행(A.x)마다 서브쿼리를 다시 계산</text>
<text class="m" x="260" y="76" text-anchor="start">① A2.x &lt; A.x 인 id 모으기</text>
<text class="m" x="260" y="98" text-anchor="start">② 그 id를 가진 B.y의 평균 = AVG(y)</text>
<text class="m" x="260" y="120" text-anchor="start">③ x &gt; AVG 인지 비교</text>
<text class="m" x="260" y="168" text-anchor="start">B.id=5(50)는 A에 없어 한 번도 안 쓰임</text>
<text class="b" x="20" y="210" text-anchor="start">④ 행마다 서브쿼리 → WHERE x &gt; AVG(y)</text>
<rect class="boxd" x="20" y="222" width="60" height="28" rx="0"/>
<text class="m b" x="50.0" y="241.0" text-anchor="middle">A.x</text>
<rect class="boxd" x="80" y="222" width="130" height="28" rx="0"/>
