<text class="m" x="300" y="196" text-anchor="middle">우선순위: NOT &gt; AND &gt; OR</text>
<text class="b" x="20" y="236" text-anchor="start">② SELECT COUNT(*) — 남은 행: EMPNO 200 하나</text>
