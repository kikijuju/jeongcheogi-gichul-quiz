<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 322" role="img" aria-label="T1과 T2의 6개 조합 중 LIKE 패턴과 맞는 smith 2개, scott 2개로 출력 4">
<style>
  text{font-family:-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;fill:#1c1e21}
